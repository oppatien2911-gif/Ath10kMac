name: Build Ath10kMac for Dell 3567

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full source commit SHA from thekunalthakur/Ath10kMac (blank uses main)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve exact upstream source commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ -z "$sha" ]]; then
            sha="$(git ls-remote --exit-code https://github.com/thekunalthakur/Ath10kMac.git refs/heads/main | cut -f1)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source commit: $sha"

      - name: Check out source and pinned submodules
        uses: actions/checkout@v6.1.0
        with:
          repository: thekunalthakur/Ath10kMac
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Build kext and app and verify x86_64
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcrun --show-sdk-path
          python3 --version
          submodules="$(git submodule status --recursive)"
          test -n "$submodules"
          printf '%s\n' "$submodules"
          if grep -Eq '^[-+U]' <<< "$submodules"; then
            echo "A submodule is missing or differs from its pinned commit." >&2
            exit 1
          fi
          test -f MacKernelSDK/Headers/Availability.h
          test -f MacKernelSDK/Library/x86_64/libkmod.a
          test -f MacKernelSDK/Library/universal/libkmodc++.a

          make clean
          make kext
          make app

          kext="build/out/Ath10kMac.kext"
          app="build/Ath10k Connectivity.app"
          for bundle in "$kext" "$app"; do
            plutil -lint "$bundle/Contents/Info.plist"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            binary="$bundle/Contents/MacOS/$executable"
            test -x "$binary"
            xcrun lipo "$binary" -verify_arch x86_64
            test "$(xcrun lipo "$binary" -archs)" = x86_64
            xcrun dwarfdump --uuid "$binary"
          done

      - name: Package bundles, licenses and build metadata
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          stage="build/dell3567-package"
          output="build/dist"
          archive="Ath10kMac-Dell3567-${SOURCE_SHA:0:12}-x86_64.zip"
          mkdir -p "$stage/Licenses" "$output"
          ditto "build/out/Ath10kMac.kext" "$stage/Ath10kMac.kext"
          ditto "build/Ath10k Connectivity.app" "$stage/Ath10k Connectivity.app"
          cp LICENSE README.md "$stage/"
          cp MacKernelSDK/LICENSE.txt "$stage/Licenses/MacKernelSDK.txt"
          cp firmware/LICENSE.QualcommAtheros_ath10k "$stage/Licenses/"
          cp firmware/notice_ath10k_firmware-6.txt "$stage/Licenses/QCA6174-firmware-notice.txt"
          cp firmware/QCA9377/hw1.0/notice_ath10k_firmware-6.txt "$stage/Licenses/QCA9377-firmware-notice.txt"
          cp firmware/QCA9377/hw1.0/PROVENANCE.json "$stage/Licenses/QCA9377-firmware-provenance.json"
          cp regulatory/LICENSE "$stage/Licenses/wireless-regdb.txt"
          {
            printf 'Source: https://github.com/thekunalthakur/Ath10kMac\nCommit: %s\nArchitecture: x86_64\n' "$SOURCE_SHA"
            printf 'Runner OS: '
            sw_vers -productVersion
            xcodebuild -version
            printf '\nSubmodules:\n'
            git submodule status --recursive
          } > "$stage/BUILD-INFO.txt"
          (
            cd "$stage"
            shasum -a 256 "Ath10kMac.kext/Contents/MacOS/Ath10kMac" \
              "Ath10k Connectivity.app/Contents/MacOS/Ath10kConnectivity" > BINARIES.sha256
            shasum -a 256 -c BINARIES.sha256
          )
          ditto -c -k "$stage" "$output/$archive"
          (
            cd "$output"
            unzip -t "$archive"
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          )
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Both executables verified as x86_64.\n\n'
            printf '```text\n'
            cat "$output/$archive.sha256"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP and SHA-256
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Ath10kMac-Dell3567-x86_64-${{ steps.source.outputs.sha }}
          path: build/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
